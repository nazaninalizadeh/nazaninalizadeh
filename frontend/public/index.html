        window.addEventListener("error", function(e) {
            // Suppress DataCloneError
            if (e.error instanceof DOMException && e.error.name === "DataCloneError" && 
                e.message && e.message.includes("PerformanceServerTiming")) {
                e.stopImmediatePropagation();
                e.preventDefault();
                return true;
            }
            // Suppress ALL PostHog errors
            if (e.message && e.message.toLowerCase().includes('posthog')) {
                e.stopImmediatePropagation();
                e.preventDefault();
                return true;
            }
            if (e.filename && e.filename.includes('posthog')) {
                e.stopImmediatePropagation();
                e.preventDefault();
                return true;
            }
            // Suppress bufferBelongsToIframe specifically
            if (e.message && e.message.includes('bufferBelongsToIframe')) {
                e.stopImmediatePropagation();
                e.preventDefault();
                return true;
            }
        }, true);
        
        // Additional unhandledrejection suppression
        window.addEventListener("unhandledrejection", function(e) {
            if (e.reason && e.reason.message && 
                (e.reason.message.includes('posthog') || e.reason.message.includes('bufferBelongsToIframe'))) {
                e.stopImmediatePropagation();
                e.preventDefault();
                return true;
            }
        });
        
        // Console error override to suppress PostHog console errors
        (function() {
            var originalError = console.error;
            console.error = function() {
                var args = Array.prototype.slice.call(arguments);
                var message = args.join(' ');
                if (message.includes('posthog') || message.includes('bufferBelongsToIframe')) {
                    return; // Suppress
                }
                originalError.apply(console, args);
            };
        })();
        </script>

        <script>
            // Continuously remove platform-injected Emergent badge per user request
            (function () {
                const removeBadge = () => {
                    const ids = ['emergent-badge'];
                    ids.forEach(id => { const el = document.getElementById(id); if (el) el.remove(); });
                    document.querySelectorAll('a[href*="utm_source=emergent-badge"], a[href*="emergent.sh"][id="emergent-badge"]').forEach(el => el.remove());
                };
                removeBadge();
                document.addEventListener('DOMContentLoaded', removeBadge);
                if (typeof MutationObserver !== 'undefined') {
                    const obs = new MutationObserver(removeBadge);
                    obs.observe(document.documentElement, { childList: true, subtree: true });
                }
            })();
        </script>
